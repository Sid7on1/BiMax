# Bimax agentic IDE packaging — DMG for macOS only.
# The headless engine is a JavaScript bundle of this repo's src/index.ts, built by
# scripts/prepare-engine.sh and shipped as an extraResource. Electron's own Node runs it in a
# utilityProcess, so no bun runtime is shipped and the artifact is architecture-independent —
# one engine/ serves arm64 and x64 alike (the dist:* npm scripts still sequence the build).
appId: ai.bimax.app
productName: Bimax
# Runs after the app is packed and BEFORE it is signed. Clears the extended attributes an
# iCloud-synced working copy stamps onto every file, which `codesign` rejects outright as
# "resource fork, Finder information, or similar detritus". See scripts/after-pack.cjs.
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: buildResources

files:
  - out/**
  # @lydell/node-pty is externalized by electron-vite (native N-API prebuilds) and must ship;
  # its platform binary lives in a @lydell/node-pty-<platform>-<arch> sibling package.
  - node_modules/@lydell/**
  # electron-liquid-glass (native Liquid Glass behind the ⌘2 bar) is externalized the same way. It loads its
  # N-API prebuild through node-gyp-build, so that ships too. Without either, the bar falls back to vibrancy.
  - node_modules/electron-liquid-glass/**
  - node_modules/node-gyp-build/**

# Native binaries can't load from inside the asar archive.
asarUnpack:
  - node_modules/@lydell/**
  - node_modules/electron-liquid-glass/**

# engine/ holds index.js (the bundle) plus the tree-sitter .wasm assets it loads at runtime.
extraResources:
  - from: engine
    to: engine
  # voice/ holds bimax-voice, the on-device dictation helper (native/voice, built by scripts/build-voice.sh).
  - from: voice
    to: voice

# intents/BimaxIntents.appex is the App Intents extension (native/intents, built by
# scripts/build-intents.sh).
#
# Contents/Extensions, NOT Contents/PlugIns. MEASURED 2026-09-20: an ExtensionKit extension (one
# declaring EXAppExtensionAttributes) is only discovered from Contents/Extensions. Placed in
# PlugIns it is embedded, signed and shipped, and Launch Services never records it — no log line,
# no pluginkit entry, nothing. PlugIns is the older NSExtension location. Every ExtensionKit
# extension on this Mac confirms it, from Safari.app/Contents/Extensions to
# /System/Library/ExtensionKit/Extensions.
extraFiles:
  - from: intents/BimaxIntents.appex
    to: Extensions/BimaxIntents.appex

asar: true

# bimax://task?folder=…&prompt=… opens a ⌘2 task after a confirmation (backlog N2; app/src/main/bimax.link.ts).
protocols:
  - name: Bimax task link
    schemes:
      - bimax

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
  darkModeSupport: true
  # macOS 13 keeps the application on a current Electron-compatible product floor.
  minimumSystemVersion: "13.0"
  # Release signing (see docs/SECURITY_INSTALL.md). Hardened runtime + entitlements are always
  # declared so that WHEN a Developer ID cert is present (CSC_LINK/CSC_KEY_PASSWORD, or one in the
  # keychain with CSC_IDENTITY_AUTO_DISCOVERY=true) electron-builder produces a correctly hardened,
  # signed app and nested XPC service. Keyless local builds remain unsigned; release CI must set
  # CSC_LINK/CSC_KEY_PASSWORD (or expose the Developer ID identity in the keychain) and verify the
  # nested service. Notarization below remains credential-gated and must never be inferred from a
  # local `codesign` pass alone.
  extendInfo:
    NSAppleEventsUsageDescription: Bimax reads the active Finder folder when you open the global thread prompt bar.
    NSMicrophoneUsageDescription: Bimax listens only while you dictate — the mic button is on or right Option is held — and turns your words into text on this Mac.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: buildResources/entitlements.mac.plist
  entitlementsInherit: buildResources/entitlements.mac.plist
  # notarize: { teamId: "YOUR_TEAM_ID" }   # uncomment for release; needs APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD

dmg:
  # DMG signing follows the app identity. Left off for unsigned dev builds; a signed release signs the
  # app inside the DMG (what Gatekeeper checks) via the mac.identity above.
  sign: false

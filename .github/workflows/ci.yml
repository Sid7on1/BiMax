name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so the required check reflects the latest push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (typecheck · lint · test)
    # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor. Pin 22.04 so the
    # bubblewrap test exercises the real Linux kernel boundary instead of merely finding the bin.
    runs-on: ubuntu-22.04
    env:
      # Tests mock the browser; never pull ~150MB of Chromium in CI.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # bubblewrap enables the Linux Bash-sandbox parity test (writes outside cwd must be denied).
      - name: Install bubblewrap (Linux sandbox backend)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Lint (warnings allowed; errors fail)
        run: npm run lint
      - name: Protocol contract fixtures are up to date
        run: |
          npm run gen:protocol
          git diff --exit-code -- src/protocol || {
            echo "::error::protocol fixtures drifted — run 'npm run gen:protocol' and commit"; exit 1; }
      # `test:ci` is jest AND `test:bun`. The 12 retrieval/tool-registry suites run under bun because
      # plain Node's `node:sqlite` has no FTS5 module, while bun and Electron — the runtime that
      # actually hosts the shipped engine — both do. Without bun on the runner the second half of the
      # command is a `bun: not found` failure, not a skip. See jest.config.ts.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Test
        run: npm run test:ci

  app:
    name: App (typecheck · build · design preview · motion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # There is no protocol-mirror gate any more. The app used to hold a GENERATED copy of the
      # engine's wire contract (protocol.gen.ts, evidence.gen.ts, protocol.compat.gen.ts) because the
      # two halves were separate TypeScript projects; a gate regenerated the copies and failed on
      # drift. They are one codebase now, so the renderer imports src/protocol/protocol.ts and
      # src/evidence/schema.ts directly and a contract change breaks the TYPECHECK below instead of
      # a drift check. Generators, gate and copies are in ~/Developer/bimax-archive (2026-09-19).
      - run: npm ci
        working-directory: app
      - name: Typecheck
        run: npm run typecheck
        working-directory: app
      - name: Build (electron-vite bundles; no packaging)
        run: npm run build
        working-directory: app
      # The design-preview harness imports the real renderer components, so it is the only thing
      # that fails when a component is deleted out from under it. It broke silently in d97018f
      # (Computer Use archive separation) and stayed broken because nothing ran it. `npm run build`
      # does NOT cover it: electron-vite never touches design-preview/.
      - name: Design-preview harness resolves
        run: npm run check:design-preview
        working-directory: app

      # The `linear()` spring curves in styles.css are compiled output, pasted from the same solver
      # the JS animations use. Nothing about a stale paste looks wrong — the animation still runs,
      # it just no longer matches the spring the JS applies to the same surface — so this compares
      # the stylesheet against the solver and fails on any divergence.
      - name: Motion tokens match the solver
        run: npm run check:motion
        working-directory: app
